name: Schema Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  schema-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate schema artifacts
        run: npm run schema:gen

      - name: Check for schema changes
        run: |
          if [ -n "$(git diff)" ]; then
            echo "Schema artifacts are out of date. Run 'npm run schema:gen' locally and commit the changes."
            git diff
            exit 1
          fi
