[pytest]
# Default test configuration for ETL service
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude network-bound tests by default
addopts =
    --strict-markers
    -m "not (integration or e2e or slow)"

# Markers
markers =
    integration: marks tests as integration tests requiring API access
    e2e: marks tests as end-to-end tests requiring live database
    slow: marks tests as slow running (network, scraping, etc.)

# Filter warnings
filterwarnings =
    ignore:Type google\._upb\._message\.MessageMapContainer uses PyType_Spec.*:DeprecationWarning
    ignore:Type google\._upb\._message\.ScalarMapContainer uses PyType_Spec.*:DeprecationWarning
